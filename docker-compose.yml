version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"  # Appliaction is available via http://localhost:8081
    volumes:
      - .:/var/www/html  #commenting for testing jenkins
    depends_on:
      - db

  db:
    image: mariadb:10.5
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edoc
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

